<div class="login-page">
  <div class="login-card">
    <div class="logo">∑</div>
    <h1>Neural Math Assistant</h1>
    <p class="subtitle">{{ registerMode ? 'Create your account' : 'Sign in to continue' }}</p>
    @if (error) { <div class="error">{{ error }}</div> }
    <form (ngSubmit)="submit()">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" [(ngModel)]="email" placeholder="you@example.com" required>
      <label for="password">Password</label>
      <input id="password" type="password" name="password" [(ngModel)]="password" placeholder="Password" required>
      <button type="submit" [disabled]="loading">{{ loading ? 'Please wait...' : registerMode ? 'Create Account' : 'Login' }}</button>
    </form>
    <button class="switch" type="button" (click)="toggleMode()">{{ registerMode ? 'Already have an account? Login' : 'Create a new account' }}</button>
  </div>
</div>
